name: Security & Quality Pipeline (HS_WSS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. Lint & SAST (Semgrep)
  # ----------------------------------------------------------------------------
  sast-semgrep:
    name: Lint & SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep Security Rules
        run: semgrep scan --config auto --error --exclude "tests" --exclude ".github" .

  # ----------------------------------------------------------------------------
  # 2. Secret Scanning (Gitleaks)
  # ----------------------------------------------------------------------------
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # 3. IaC & Container Scanning (Checkov)
  # ----------------------------------------------------------------------------
  iac-checkov:
    name: IaC Scanning (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@master
        with:
          framework: dockerfile
          output_format: cli
          soft_fail: false

  # ----------------------------------------------------------------------------
  # 4. Dependency & Vulnerability Scan (Trivy)
  # ----------------------------------------------------------------------------
  dependency-trivy:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # ----------------------------------------------------------------------------
  # 5. Supply Chain SBOM Generation (CycloneDX)
  # ----------------------------------------------------------------------------
  supply-chain-sbom:
    name: Supply Chain SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & CycloneDX Generator
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          pip install -r requirements.txt

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements -i requirements.txt -o cyclonedx-bom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: cyclonedx-bom.json
          retention-days: 90
